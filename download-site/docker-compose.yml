services:
  uvp-download-site:
    image: nginx:1.27-alpine
    container_name: uvp-download-site
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      scripts_my-network:
        aliases:
          - uvp-download-site

networks:
  scripts_my-network:
    external: true

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8"
  JAVA_TOOL_OPTIONS: "-Xmx5g"

jobs:
  build-test:
    name: Build & Test (ubuntu / jdk17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Cache Konan (KMP iOS prebuilt)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.2.21-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-kotlin-2.2.21-
            konan-${{ runner.os }}-

      - name: Compile shared metadata (KMP fast-fail)
        run: ./gradlew :shared:compileKotlinMetadata --stacktrace

      - name: Run shared JVM tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Run androidApp Debug unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build androidApp Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            **/build/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore

  release-android:
    name: Release Android APK & Deploy Download Site
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: android-release-download-site
      cancel-in-progress: false
    env:
      DOWNLOAD_DEPLOY_SITE_ROOT: /opt/uvp-download-site
      DOWNLOAD_SITE_URL: https://download.uvplatform.cn

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version_code="$(python3 scripts/release/version_code.py "$version")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'version_code=%s\n' "$version_code" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?missing ANDROID_RELEASE_KEYSTORE_BASE64}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?missing ANDROID_RELEASE_STORE_PASSWORD}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?missing ANDROID_RELEASE_KEY_ALIAS}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?missing ANDROID_RELEASE_KEY_PASSWORD}"
          release_dir="$RUNNER_TEMP/uvp-release"
          mkdir -m 700 -p "$release_dir"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$release_dir/release.jks"
          chmod 600 "$release_dir/release.jks"
          mkdir -p "$HOME/.gradle"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$release_dir/release.jks" \
            "$ANDROID_RELEASE_STORE_PASSWORD" \
            "$ANDROID_RELEASE_KEY_ALIAS" \
            "$ANDROID_RELEASE_KEY_PASSWORD" \
            > "$HOME/.gradle/uvp-sim-keystore.properties"
          chmod 600 "$HOME/.gradle/uvp-sim-keystore.properties"

      - name: Run release test gates
        run: |
          ./gradlew :shared:compileKotlinMetadata --stacktrace
          ./gradlew :shared:jvmTest --stacktrace
          ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build signed Release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PuvpVersionName="$VERSION" \
            -PuvpVersionCode="$VERSION_CODE" \
            --stacktrace

      - name: Generate release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="androidApp/build/outputs/apk/release/uvp-gb28181-sim-${VERSION}.apk"
          test -s "$apk"
          mkdir -p build/release
          cp "$apk" "build/release/"
          python3 scripts/release/generate-mobile-metadata.py \
            --apk "build/release/$(basename "$apk")" \
            --version "$VERSION" \
            --version-code "$VERSION_CODE" \
            --release-date "$(date -u +%F)" \
            --output build/release/mobile.json
          python3 -m json.tool build/release/mobile.json >/dev/null

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: uvp-gb28181-sim-${{ steps.version.outputs.version }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30

      - name: Configure deployment SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOWNLOAD_DEPLOY_SSH_KEY }}

      - name: Upload and atomically publish to 115
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DOWNLOAD_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DOWNLOAD_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DOWNLOAD_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DOWNLOAD_DEPLOY_KNOWN_HOSTS }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?missing DOWNLOAD_DEPLOY_HOST}"
          : "${DEPLOY_PORT:?missing DOWNLOAD_DEPLOY_PORT}"
          : "${DEPLOY_USER:?missing DOWNLOAD_DEPLOY_USER}"
          : "${KNOWN_HOSTS:?missing DOWNLOAD_DEPLOY_KNOWN_HOSTS}"
          known_hosts="$RUNNER_TEMP/uvp-known-hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$known_hosts"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -p "$DEPLOY_PORT")
          scp_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -P "$DEPLOY_PORT")
          remote_staging="${DOWNLOAD_DEPLOY_SITE_ROOT}/.ci-staging/${VERSION}-${RUN_ID}-${RUN_ATTEMPT}"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "umask 077 && mkdir -p '$remote_staging'"
          scp "${scp_opts[@]}" build/release/*.apk build/release/mobile.json scripts/release/deploy-download-site.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:$remote_staging/"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 700 '$remote_staging/deploy-download-site.sh' && '$remote_staging/deploy-download-site.sh' '$DOWNLOAD_DEPLOY_SITE_ROOT' '$remote_staging' '$VERSION'"

      - name: Verify published HTTPS metadata and APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/published-mobile.json"
          apk="$RUNNER_TEMP/published.apk"
          curl --fail --silent --show-error --location \
            "$DOWNLOAD_SITE_URL/releases/mobile.json" -o "$json"
          python3 - "$json" "$VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["version"] == sys.argv[2], payload
          assert payload["filename"] == f"uvp-gb28181-sim-{sys.argv[2]}.apk", payload
          assert len(payload["sha256"]) == 64, payload
          print(f"published version={payload['version']} sha256={payload['sha256']}")
          PY
          filename="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["filename"])' "$json")"
          expected_bytes="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bytes"])' "$json")"
          expected_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$json")"
          curl --fail --silent --show-error --location \
            "$DOWNLOAD_SITE_URL/releases/$filename" -o "$apk"
          test "$(stat -c '%s' "$apk")" = "$expected_bytes"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$expected_sha"
          printf 'HTTPS release verification passed: %s (%s bytes)\n' "$filename" "$expected_bytes"

  ios-check:
    name: iOS Compile Check (macos / jdk17)
    if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Cache Konan (KMP iOS prebuilt)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-kotlin-2.2.21-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-macos-kotlin-2.2.21-
            konan-macos-

      - name: Compile shared iosArm64
        run: ./gradlew :shared:compileKotlinIosArm64 --stacktrace

      - name: Compile shared iosSimulatorArm64
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      # cross-review R2 #2:composeApp/iosMain 有大量 UI + Filament + 桥接代码,
      # 只编 shared 会漏掉 composeApp iosMain 的 Kotlin 编译错误。加两个 target 的
      # compile 门禁,把 iosMain 层守住。iosApp/Swift 完整 xcodebuild 太重,留在
      # 发版前手动跑 xcodegen + Xcode ⌘R 验证。
      - name: Compile composeApp iosArm64
        run: ./gradlew :composeApp:compileKotlinIosArm64 --stacktrace

      - name: Compile composeApp iosSimulatorArm64
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace

      # ComposeApp.framework linking:验 KMP → framework 的 export/hidden symbol
      # 组装能过。若 iosApp 侧 link 失败通常在这一步暴露(export 缺项 / 符号丢失)。
      - name: Assemble composeApp iOS framework (simulator)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Run shared iosSimulatorArm64 tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload iOS test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
            **/build/outputs/logs/**
          retention-days: 7
          if-no-files-found: ignore
